[project]
name = "slurm-tools"
version = "0.2.3"
description = "SLURM job submission CLI and web monitoring GUI"
requires-python = ">=3.10"
dependencies = ["draccus", "flask>=3.0", "pyyaml"]

[project.scripts]
slurm = "slurm_tools.slurm:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
