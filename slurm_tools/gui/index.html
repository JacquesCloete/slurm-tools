<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SLURM Monitor</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖥️</text></svg>"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <script src="https://unpkg.com/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.3.0/sse.js"></script>
  </head>
  <body>
    <h1>SLURM Monitor</h1>

    {% if clusters|length > 1 %}
    <div class="tabs">
      {% for c in clusters %}
      <button
        class="tab{% if loop.first %} active{% endif %}"
        onclick="switchCluster('{{ c }}', this)"
      >
        {{ c }}
      </button>
      {% endfor %}
    </div>
    {% endif %}

    <div class="layout">
      <div class="left">
        <div class="card left-top">
          <div class="card-header">
            <h2>Jobs</h2>
          </div>
          <div
            id="jobs-pane"
            hx-get="/jobs"
            hx-vals='js:{cluster: currentCluster}'
            hx-trigger="load, every 10s"
            hx-swap="innerHTML"
          >
            Loading...
          </div>
        </div>
        <div class="card left-bottom">
          <div class="card-header">
            <h2>GPUs</h2>
            <div
              id="sched-pane"
              hx-get="/sched"
              hx-vals='js:{cluster: currentCluster}'
              hx-trigger="load, every 30s"
              hx-swap="innerHTML"
            ></div>
          </div>
          <div
            id="nodes-pane"
            hx-get="/nodes"
            hx-vals='js:{cluster: currentCluster}'
            hx-trigger="load, every 30s"
            hx-swap="innerHTML"
          >
            Loading...
          </div>
        </div>
      </div>
      <div class="card right" id="log-panel">
        <div class="log-placeholder" id="log-placeholder">
          Select a job to view logs
        </div>
        <div id="log-content" style="display: none">
          <div class="log-header">
            <h2 id="log-title">Logs</h2>
            <button class="btn" onclick="closeLog()">Close</button>
          </div>
          <pre class="log" id="log-stream"></pre>
        </div>
      </div>
    </div>

    <script>
      var _src, _ctrl, _buf = "", _raf = 0;
      var _logEl;
      var currentCluster = {{ clusters[0]|tojson }};

      function switchCluster(name, btn) {
        if (name === currentCluster) return;
        currentCluster = name;
        closeLog();
        $(".tab").removeClass("active");
        $(btn).addClass("active");
        htmx.ajax("GET", "/jobs", {
          target: "#jobs-pane",
          swap: "innerHTML",
          values: { cluster: name },
        });
        htmx.ajax("GET", "/nodes", {
          target: "#nodes-pane",
          swap: "innerHTML",
          values: { cluster: name },
        });
        htmx.ajax("GET", "/sched", {
          target: "#sched-pane",
          swap: "innerHTML",
          values: { cluster: name },
        });
      }

      function _flush() {
        _raf = 0;
        if (!_buf || !_logEl) return;
        _logEl.appendChild(document.createTextNode(_buf));
        _buf = "";
        _logEl.scrollTop = _logEl.scrollHeight;
      }
      function _append(text) {
        _buf += text;
        if (!_raf) _raf = requestAnimationFrame(_flush);
      }

      async function _loadHistory(id, signal) {
        var res = await fetch(
          "/logs/" + id + "/history?cluster=" + encodeURIComponent(currentCluster),
          { signal: signal },
        );
        if (!res.ok || !res.body) return;
        var reader = res.body.getReader();
        var dec = new TextDecoder();
        while (true) {
          var { done, value } = await reader.read();
          if (done) break;
          _append(dec.decode(value, { stream: true }));
        }
        _append(dec.decode());
      }

      function openLog(id, follow) {
        closeLog();
        $("#log-placeholder").hide();
        $("#log-content").css("display", "flex");
        $("#log-title").text("Job " + id);
        _logEl = document.getElementById("log-stream");
        _logEl.textContent = "";

        var ctrl = new AbortController();
        _ctrl = ctrl;
        _loadHistory(id, ctrl.signal)
          .catch(function (e) {
            if (e.name !== "AbortError") console.error(e);
          })
          .then(function () {
            if (!follow || _ctrl !== ctrl || ctrl.signal.aborted) return;
            _src = new EventSource(
              "/logs/" + id + "?cluster=" + encodeURIComponent(currentCluster),
            );
            _src.onmessage = function (e) {
              _append(e.data + "\n");
            };
            _src.onerror = function () {
              _src.close();
            };
          });
      }
      function closeLog() {
        if (_src) { _src.close(); _src = null; }
        if (_ctrl) { _ctrl.abort(); _ctrl = null; }
        if (_raf) { cancelAnimationFrame(_raf); _raf = 0; }
        _buf = "";
        $("#log-content").hide();
        $("#log-placeholder").css("display", "flex");
        var el = document.getElementById("log-stream");
        if (el) el.textContent = "";
        _logEl = null;
      }
      function cancelJob(id, btn) {
        if (!confirm("Cancel job " + id + "?")) return;
        var $btn = $(btn);
        $btn.prop("disabled", true).text("cancelling…");
        $.post(
          "/cancel/" + id + "?cluster=" + encodeURIComponent(currentCluster),
        ).always(function () {
          htmx.ajax("GET", "/jobs", {
            target: "#jobs-pane",
            swap: "innerHTML",
            values: { cluster: currentCluster },
          });
        });
      }
    </script>
  </body>
</html>
